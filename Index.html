<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Autopilot AI</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
}

body {
    background: #f4f7fb;
    color: #172033;
}

header {
    background: #111827;
    color: white;
    padding: 22px;
}

header h1 {
    font-size: 26px;
}

header p {
    margin-top: 6px;
    color: #b8c1d1;
}

.container {
    max-width: 1100px;
    margin: auto;
    padding: 20px;
}

.cards {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 15px;
    margin-bottom: 25px;
}

.card {
    background: white;
    padding: 20px;
    border-radius: 14px;
    box-shadow: 0 3px 12px rgba(0,0,0,0.06);
}

.card h3 {
    font-size: 14px;
    color: #667085;
    margin-bottom: 10px;
}

.card strong {
    font-size: 28px;
}

.section {
    background: white;
    border-radius: 14px;
    padding: 20px;
    margin-bottom: 20px;
    box-shadow: 0 3px 12px rgba(0,0,0,0.06);
}

.section h2 {
    margin-bottom: 15px;
}

table {
    width: 100%;
    border-collapse: collapse;
}

th, td {
    padding: 13px;
    text-align: left;
    border-bottom: 1px solid #eee;
}

th {
    color: #667085;
    font-size: 13px;
}

.status {
    padding: 6px 10px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: bold;
}

.urgent {
    background: #fee2e2;
    color: #b91c1c;
}

.watch {
    background: #fef3c7;
    color: #92400e;
}

.healthy {
    background: #dcfce7;
    color: #166534;
}

.insight {
    background: #eef2ff;
    padding: 18px;
    border-radius: 12px;
    line-height: 1.6;
}

button {
    border: none;
    padding: 11px 16px;
    border-radius: 8px;
    background: #111827;
    color: white;
    cursor: pointer;
}

button:hover {
    opacity: 0.9;
}

.form {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
}

input {
    padding: 12px;
    border: 1px solid #d0d5dd;
    border-radius: 8px;
    width: 100%;
}

@media (max-width: 700px) {
    .cards {
        grid-template-columns: repeat(2, 1fr);
    }

    .form {
        grid-template-columns: 1fr;
    }

    table {
        font-size: 13px;
    }

    th:nth-child(4),
    td:nth-child(4) {
        display: none;
    }
}
</style>
</head>

<body>

<header>
    <h1>🤖 Autopilot AI</h1>
    <p>Your AI-powered business operations dashboard</p>
</header>

<div class="container">

    <div class="cards">
        <div class="card">
            <h3>🔴 Urgent</h3>
            <strong id="urgent">0</strong>
        </div>

        <div class="card">
            <h3>🟡 Watch</h3>
            <strong id="watch">0</strong>
        </div>

        <div class="card">
            <h3>🟢 Healthy</h3>
            <strong id="healthy">0</strong>
        </div>

        <div class="card">
            <h3>💰 Stock Value</h3>
            <strong id="value">₹0</strong>
        </div>
    </div>

    <div class="section">
        <h2>📦 Inventory Autopilot</h2>

        <table>
            <thead>
                <tr>
                    <th>Product</th>
                    <th>Stock</th>
                    <th>Days Left</th>
                    <th>Status</th>
                </tr>
            </thead>

            <tbody id="products"></tbody>
        </table>
    </div>

    <div class="section">
        <h2>🤖 Autopilot Insight</h2>

        <div class="insight" id="insight">
            Analyzing your business...
        </div>
    </div>

    <div class="section">
        <h2>➕ Add Product</h2>

        <div class="form">

            <input id="name" placeholder="Product name">

            <input id="stock" type="number" placeholder="Current stock">

            <input id="sales" type="number" placeholder="Daily sales">

            <input id="minimum" type="number" placeholder="Minimum stock">

            <input id="cost" type="number" placeholder="Cost price">

            <button onclick="addProduct()">Add Product</button>

        </div>
    </div>

</div>

<script>

let products = [
    {
        name: "Cooking Oil 1L",
        stock: 4,
        sales: 2,
        minimum: 6,
        cost: 120
    },

    {
        name: "Rice 5kg",
        stock: 18,
        sales: 3,
        minimum: 5,
        cost: 300
    },

    {
        name: "Sugar 1kg",
        stock: 40,
        sales: 2,
        minimum: 10,
        cost: 48
    },

    {
        name: "Biscuits",
        stock: 8,
        sales: 4,
        minimum: 10,
        cost: 20
    }
];

function analyze() {

    let urgent = 0;
    let watch = 0;
    let healthy = 0;
    let totalValue = 0;

    const table = document.getElementById("products");

    table.innerHTML = "";

    products.forEach(product => {

        let days;

        if (product.sales <= 0) {
            days = "∞";
        } else {
            days = Math.floor(product.stock / product.sales);
        }

        totalValue += product.stock * product.cost;

        let status;
        let className;

        if (product.stock <= product.minimum || days <= 2) {

            status = "URGENT";
            className = "urgent";
            urgent++;

        } else if (days <= 7) {

            status = "WATCH";
            className = "watch";
            watch++;

        } else {

            status = "HEALTHY";
            className = "healthy";
            healthy++;
        }

        table.innerHTML += `
            <tr>
                <td>${product.name}</td>
                <td>${product.stock}</td>
                <td>${days}</td>
                <td>
                    <span class="status ${className}">
                        ${status}
                    </span>
                </td>
            </tr>
        `;
    });

    document.getElementById("urgent").innerText = urgent;
    document.getElementById("watch").innerText = watch;
    document.getElementById("healthy").innerText = healthy;
